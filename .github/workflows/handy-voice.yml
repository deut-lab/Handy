# Handy Voice: follows Handy's releases and builds the fork for Windows and
# macOS into a draft release. How it works, the secrets it needs, how to fix
# a conflict and how to publish: .github/handy-voice/README.md
name: "Handy Voice"

on:
  schedule:
    # Mondays, 05:23 UTC.
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Build the current branch as a new fork build, also when Handy has no new release"
        type: boolean
        default: false

concurrency:
  group: handy-voice
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

env:
  UPSTREAM: cjpais/Handy
  BRANCH: handy-voice

jobs:
  # Cheap weekly check: reads the base tag and Handy's latest release.
  check:
    name: Is there a new Handy?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      base: ${{ steps.check.outputs.base }}
      latest: ${{ steps.check.outputs.latest }}
      newer: ${{ steps.check.outputs.newer }}
    steps:
      - name: Only on the handy-voice branch
        if: github.ref != 'refs/heads/handy-voice'
        run: |
          echo "::error::Run this workflow on the $BRANCH branch, not on $GITHUB_REF."
          exit 1

      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/handy-voice

      - name: Compare the base with Handy's latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=$(tr -d '[:space:]' <.github/handy-voice/base)
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          for tag in "$base" "$latest"; do
            if ! [[ $tag =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Unexpected tag name: '$tag'"
              exit 1
            fi
          done
          newer=false
          if [ "$latest" != "$base" ] &&
            [ "$(printf '%s\n' "${base#v}" "${latest#v}" | sort -V | tail -n 1)" = "${latest#v}" ]; then
            newer=true
          fi
          {
            echo "base=$base"
            echo "latest=$latest"
            echo "newer=$newer"
          } >>"$GITHUB_OUTPUT"
          if [ "$newer" = true ]; then
            echo "Handy $latest is out; the fork is on $base and moves onto it." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No new Handy: the fork is on $base, Handy's latest release is $latest." >>"$GITHUB_STEP_SUMMARY"
          fi

  # A new Handy: move the fork commits onto it, push, and start a build run.
  # The build runs separately, from the moved branch, so it uses the build
  # steps of the new Handy (handy-voice-build.yml is made from its build.yml).
  follow:
    name: Move the fork onto the new Handy
    needs: check
    if: needs.check.outputs.newer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      actions: write
    env:
      BASE: ${{ needs.check.outputs.base }}
      NEW: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # Moving the branch also moves Handy's own workflow files, and
          # GitHub lets only a token with the Workflows permission push those.
          token: ${{ secrets.HANDY_VOICE_TOKEN || github.token }}

      - name: Rebase the fork commits onto the new Handy
        run: |
          problem() { cat >"$RUNNER_TEMP/problem.md"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"

          if ! [[ $NEW =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            problem <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW), но её номер не вида vX.Y.Z. Номер сборки форка из такого не составить, поэтому ветка \`$BRANCH\` не изменена и сборки нет.

          Что сделать: сессия Claude переносит ветку на эту версию вручную по правилам PORTING.md (он лежит рядом с клоном репозитория, в папке voice-lab) и решает, какой номер дать сборке. Шаги — в \`.github/handy-voice/README.md\`, раздел «Fixing a conflict».
          EOF
          fi

          git fetch --no-tags "https://github.com/$UPSTREAM.git" \
            "+refs/tags/$BASE:refs/upstream/$BASE" "+refs/tags/$NEW:refs/upstream/$NEW"

          if ! git merge-base --is-ancestor "refs/upstream/$BASE" HEAD; then
            problem <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW). Перенести на неё доработки не получилось: в файле \`.github/handy-voice/base\` записана версия $BASE, но ветка \`$BRANCH\` построена не на ней. Ветка не изменена, сборки нет.

          Что сделать: сессия Claude проверяет, на какой версии Handy стоит ветка, исправляет \`.github/handy-voice/base\` и переносит ветку на $NEW по правилам PORTING.md (он лежит рядом с клоном репозитория, в папке voice-lab). Шаги — в \`.github/handy-voice/README.md\`, раздел «Fixing a conflict».
          EOF
          fi

          if ! git rebase --onto "refs/upstream/$NEW" "refs/upstream/$BASE" >"$RUNNER_TEMP/rebase.log" 2>&1; then
            cat "$RUNNER_TEMP/rebase.log"
            stopped=$(git log -1 --format='«%s» (%h)' REBASE_HEAD 2>/dev/null || echo "неизвестно")
            files=$(git diff --name-only --diff-filter=U | sed 's/.*/- `&`/')
            git rebase --abort
            problem <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW). Перенести на неё доработки Handy Voice автоматически не получилось: доработка и новая версия Handy меняют одни и те же места в файлах.

          Остановился на доработке: $stopped

          Файлы, где изменения столкнулись:
          ${files:-- (список не получен, см. журнал запуска)}

          После исправления этих файлов столкновения могут найтись и в следующих доработках.

          Ничего не изменено: ветка \`$BRANCH\` осталась на Handy $BASE, сборки нет, установленные Handy Voice обновлений не получат, пока это не исправлено.

          Что сделать: открыть сессию Claude на компьютере с клоном этого репозитория и попросить: «Перенеси ветку $BRANCH на Handy $NEW по правилам PORTING.md и запусти сборку». PORTING.md лежит рядом с клоном, в папке voice-lab. Шаги — в \`.github/handy-voice/README.md\`, раздел «Fixing a conflict».
          EOF
          fi
          cat "$RUNNER_TEMP/rebase.log"

          echo "$NEW" >.github/handy-voice/base
          if ! bash .github/handy-voice/make-build-workflow.sh 2>"$RUNNER_TEMP/make.log"; then
            cat "$RUNNER_TEMP/make.log"
            why=$(cat "$RUNNER_TEMP/make.log")
            problem <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW). Доработки на неё переносятся, но Handy изменил свою сборку (\`.github/workflows/build.yml\`), и \`.github/handy-voice/make-build-workflow.sh\` не может внести в неё свои правки:

          > $why

          Ничего не изменено: ветка \`$BRANCH\` осталась на Handy $BASE, сборки нет.

          Что сделать: сессия Claude переносит ветку на $NEW по правилам PORTING.md (он лежит рядом с клоном репозитория, в папке voice-lab) и поправляет make-build-workflow.sh под новый build.yml. Шаги — в \`.github/handy-voice/README.md\`, раздел «Fixing a conflict».
          EOF
          fi
          git add .github/handy-voice/base .github/workflows/handy-voice-build.yml
          git commit -q -m "voice: base Handy $NEW" \
            -m "Moved from Handy $BASE by the handy-voice workflow: the base tag and the build workflow made from Handy's build.yml."
          echo "Fork commits on Handy $NEW:"
          git log --oneline "refs/upstream/$NEW..HEAD"

      - name: Keep the old branch as a tag, push the moved branch
        run: |
          before="handy-voice-before-$NEW"
          git tag -f "$before" "$GITHUB_SHA"
          if ! git push origin "refs/tags/$before" 2>"$RUNNER_TEMP/push.log" ||
            ! git push --force-with-lease="refs/heads/$BRANCH:$GITHUB_SHA" origin "HEAD:refs/heads/$BRANCH" 2>>"$RUNNER_TEMP/push.log"; then
            cat "$RUNNER_TEMP/push.log"
            if grep -qi "workflow" "$RUNNER_TEMP/push.log"; then
              why="GitHub не дал записать ветку: в новой версии Handy изменены его файлы в \`.github/workflows\`, а записывать их можно только с ключом \`HANDY_VOICE_TOKEN\`, у которого есть право Workflows (Read and write). Ключа нет, он истёк или у него нет этого права."
            else
              why="GitHub не дал записать ветку или тег \`$before\` (подробности в журнале запуска). Возможно, ветку \`$BRANCH\` за это время изменили, или тег \`$before\` уже есть и указывает на другой коммит."
            fi
            cat >"$RUNNER_TEMP/problem.md" <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW). Доработки на неё перенеслись без столкновений, но записать результат не получилось.

          $why

          Ветка \`$BRANCH\` осталась на Handy $BASE, сборки нет. После исправления причины запустите workflow «Handy Voice» вручную (Actions → Handy Voice → Run workflow) — он повторит перенос. Подробнее — в \`.github/handy-voice/README.md\`.
          EOF
            exit 1
          fi
          cat "$RUNNER_TEMP/push.log"
          echo "The fork is now on Handy $NEW; the old branch is kept as the tag $before." >>"$GITHUB_STEP_SUMMARY"

      - name: Start the build of the moved branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run handy-voice.yml -R "$GITHUB_REPOSITORY" --ref "$BRANCH" -f rebuild=true; then
            cat >"$RUNNER_TEMP/problem.md" <<EOF
          Ветка \`$BRANCH\` перенесена на Handy [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW), но сборку запустить не удалось.

          Что сделать: Actions → Handy Voice → Run workflow, ветка \`$BRANCH\`, галочка «rebuild». Получится черновик выпуска, его проверить и опубликовать по \`.github/handy-voice/README.md\`.
          EOF
            exit 1
          fi
          echo "Started the build run (Actions → Handy Voice, rebuild)." >>"$GITHUB_STEP_SUMMARY"

      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          file="$RUNNER_TEMP/problem.md"
          if [ ! -s "$file" ]; then
            cat >"$file" <<EOF
          Вышла новая версия Handy — [$NEW](https://github.com/$UPSTREAM/releases/tag/$NEW). Перенести на неё доработки Handy Voice не получилось: запуск остановился с ошибкой, подробности в его журнале. Частая причина — ключ \`HANDY_VOICE_TOKEN\` истёк или неверен.

          Что сделать: открыть журнал запуска (ссылка ниже) и, если причина не очевидна, попросить сессию Claude разобраться по \`.github/handy-voice/README.md\` и PORTING.md (он лежит рядом с клоном репозитория, в папке voice-lab).
          EOF
          fi
          printf '\nЗапуск: %s\n' "$RUN_URL" >>"$file"
          title="Handy Voice: не получилось перейти на Handy $NEW"
          open=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title $NEW" \
            --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -n "$open" ]; then
            echo "Issue #$open about Handy $NEW is already open."
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file "$file"
          fi

  # rebuild: tag the branch tip with the fork version and make a draft release.
  release:
    name: Version and draft release
    needs: check
    if: needs.check.outputs.newer == 'false' && inputs.rebuild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.id }}
      ref: ${{ steps.version.outputs.ref }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.HANDY_VOICE_TOKEN || github.token }}

      - name: Check the build workflow is made from this build.yml
        run: |
          bash .github/handy-voice/make-build-workflow.sh
          if ! git diff --exit-code -- .github/workflows/handy-voice-build.yml; then
            echo "::error::.github/workflows/handy-voice-build.yml is out of date: run .github/handy-voice/make-build-workflow.sh and commit it."
            exit 1
          fi

      - name: Fork version and its tag
        id: version
        run: |
          base=$(tr -d '[:space:]' <.github/handy-voice/base)
          if ! [[ $base =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::.github/handy-voice/base is '$base', not vX.Y.Z"
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=$((10#${BASH_REMATCH[3]}))
          # Build number: one more than the highest voice-v tag on this Handy.
          prefix="refs/tags/voice-v$major.$minor."
          build=0
          while read -r ref; do
            p=${ref#"$prefix"}
            [[ $p =~ ^[0-9]+$ ]] || continue
            p=$((10#$p))
            if ((p / 100 == patch && p % 100 + 1 > build)); then
              build=$((p % 100 + 1))
            fi
          done < <(git ls-remote --tags --refs origin "${prefix}*" | cut -f 2)

          version=$(bash .github/handy-voice/set-version.sh "$base" "$build")
          tag="voice-v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -q -a -m "voice: Handy Voice $version" \
            -m "Handy $base, fork build $build. Made by the handy-voice workflow; only the tag $tag points here."
          git tag "$tag"
          git push origin "refs/tags/$tag"
          {
            echo "base=$base"
            echo "build=$build"
            echo "version=$version"
            echo "tag=$tag"
            echo "ref=refs/tags/$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ steps.version.outputs.base }}
          BUILD: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/$BASE:refs/upstream/$BASE"
          bash .github/handy-voice/release-notes.sh "$BASE" "$BUILD" "$VERSION" "refs/upstream/$BASE" "$GITHUB_SHA" >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" -f name="Handy Voice $VERSION" \
            -F draft=true -F prerelease=false -F body=@"$RUNNER_TEMP/notes.md" --jq .id)
          echo "id=$id" >>"$GITHUB_OUTPUT"
          echo "Draft release $TAG (Handy $BASE, fork build $BUILD) created; the installers follow." >>"$GITHUB_STEP_SUMMARY"

  # Upstream's build steps (made from its build.yml), Windows and macOS only.
  build:
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
            target: "x86_64-pc-windows-msvc"
          - platform: "macos-26" # Apple Silicon; macOS 26 for the Apple Intelligence SDK, as upstream.
            args: "--target aarch64-apple-darwin"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest" # Intel Macs, cross-built as upstream.
            args: "--target x86_64-apple-darwin"
            target: "x86_64-apple-darwin"
    uses: ./.github/workflows/handy-voice-build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      # No Apple or Azure signing; the updater key is passed regardless.
      sign-binaries: false
      asset-prefix: "handy-voice"
      upload-artifacts: false
      release-id: ${{ needs.release.outputs.release-id }}
      ref: ${{ needs.release.outputs.ref }}
      # As upstream's releases: always from scratch, never a cached native lib.
      no-cache: true
    secrets: inherit

  # latest.json for the updater, once, from the uploaded installers and .sig files.
  finalize:
    name: Updater manifest
    needs: [release, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write latest.json into the draft
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.release.outputs.release-id }}
          TAG: ${{ needs.release.outputs.tag }}
          VERSION: ${{ needs.release.outputs.version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.TAG;
            const version = process.env.VERSION;

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });
            const byName = new Map(assets.map((asset) => [asset.name, asset]));

            // The one installer or update archive with a .sig next to it.
            const pick = (what, test) => {
              const found = assets.filter((a) => test(a.name) && byName.has(`${a.name}.sig`));
              if (found.length !== 1) {
                throw new Error(`Expected one ${what} with a .sig in the draft, found ${found.length}: ` +
                  assets.map((a) => a.name).join(', '));
              }
              return found[0];
            };
            const entry = async (asset) => {
              const sig = byName.get(`${asset.name}.sig`);
              const { data } = await github.request('GET /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner, repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' },
              });
              return {
                signature: Buffer.from(data).toString('utf8').trim(),
                url: `https://github.com/${owner}/${repo}/releases/download/${encodeURIComponent(tag)}/${encodeURIComponent(asset.name)}`,
              };
            };

            const nsis = await entry(pick('Windows setup.exe', (n) => n.endsWith('_x64-setup.exe')));
            const msi = await entry(pick('Windows .msi', (n) => /_x64_[^_]+\.msi$/.test(n)));
            const arm = await entry(pick('Apple Silicon update', (n) => n.endsWith('_aarch64.app.tar.gz')));
            const intel = await entry(pick('Intel Mac update', (n) => n.endsWith('_x64.app.tar.gz')));

            // The updater looks for {os}-{arch}-{installer} first, then {os}-{arch}.
            // Installed copies come from the setup.exe, so plain windows-x86_64 is NSIS.
            const manifest = {
              version,
              notes: `Handy Voice ${version}`,
              pub_date: new Date().toISOString(),
              platforms: {
                'windows-x86_64': nsis,
                'windows-x86_64-nsis': nsis,
                'windows-x86_64-msi': msi,
                'darwin-aarch64': arm,
                'darwin-aarch64-app': arm,
                'darwin-x86_64': intel,
                'darwin-x86_64-app': intel,
              },
            };

            const old = byName.get('latest.json');
            if (old) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            }
            const body = JSON.stringify(manifest, null, 2);
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id, name: 'latest.json', data: body,
              headers: { 'content-type': 'application/json', 'content-length': Buffer.byteLength(body) },
            });

            const { data: release } = await github.rest.repos.getRelease({ owner, repo, release_id });
            await core.summary
              .addRaw(`Draft ready: ${release.html_url}\n\nCheck it and publish it by hand (see .github/handy-voice/README.md).`)
              .write();
